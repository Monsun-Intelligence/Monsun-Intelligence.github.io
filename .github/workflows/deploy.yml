name: Deploy Vue app to GitHub Pages

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 📚 Build Monsun Labs docs
        run: |
          git clone --depth 1 https://github.com/monsun-labs/monsun-labs.github.io.git /tmp/monsun-labs
          pip install zensical
          cd /tmp/monsun-labs
          zensical build --clean

      - name: 🚀 Deploy to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout --orphan main-deploy
          git rm -rf .
          cp -r dist/* .
          mkdir -p labs
          cp -r /tmp/monsun-labs/site/* labs/
          touch labs/.nojekyll
          git add -A
          git commit -m "🚀 Deploy new build [skip ci]"
          git push -f origin main-deploy:main